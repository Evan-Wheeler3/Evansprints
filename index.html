<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evansprints — Disc Golf Gear</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">EVANS<span>PRINTS</span></a>
  <nav class="site-nav">
    <a href="shop-minis.html">Minis</a>
    <a href="shop-bag-tags.html">Bag Tags</a>
  </nav>
</header>

<main>
<svg class="hero" viewBox="0 0 1100 800" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Disc golf backpack bag angled to the left, with two bag tags clipped on and a mini marker disc lying beside it</title>
  <defs>
    <linearGradient id="gFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset=".75" stop-color="#2a3748"/>
      <stop offset="1" stop-color="#334256"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202b39"/>
      <stop offset="1" stop-color="#121922"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46576d"/>
      <stop offset="1" stop-color="#34445a"/>
    </linearGradient>
    <linearGradient id="gPocket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26313f"/>
      <stop offset="1" stop-color="#1a222d"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".45" stop-color="#b9c0c8"/>
      <stop offset=".7" stop-color="#e8ebee"/>
      <stop offset="1" stop-color="#8d959e"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset=".45" stop-color="#d4a23a"/>
      <stop offset=".7" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#a67816"/>
    </linearGradient>
    <linearGradient id="gMini" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
      <rect width="9" height="9" fill="#0f151d"/>
      <path d="M0 4.5h9M4.5 0v9" stroke="#2c394a" stroke-width="1.6"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softSm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- ground shadows -->
  <ellipse cx="615" cy="668" rx="240" ry="26" fill="#000" opacity=".18" filter="url(#soft)"/>
  <ellipse cx="356" cy="712" rx="70" ry="12" fill="#000" opacity=".22" filter="url(#softSm)"/>

  <!-- ===== BAG ===== -->
  <g class="bag" stroke-linejoin="round">
    <!-- shoulder strap peeking out behind the right/back edge -->
    <path d="M760 185 C 812 240, 808 420, 790 520 C 782 570, 774 600, 760 618" fill="none" stroke="#0d1218" stroke-width="22" stroke-linecap="round"/>
    <path d="M760 185 C 812 240, 808 420, 790 520 C 782 570, 774 600, 760 618" fill="none" stroke="#2b3949" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="788" y="380" width="22" height="34" rx="4" fill="#ff5a1f" transform="rotate(4 799 397)"/>

    <!-- side panel -->
    <path d="M640 195 L765 170 Q772 172 772 180 L766 626 Q764 634 756 636 L640 666 Z" fill="url(#gSide)" stroke="#0e141b" stroke-width="6"/>
    <!-- front panel -->
    <path d="M450 165 L640 195 L640 666 L462 618 Q455 616 455 608 L446 176 Q446 166 450 165 Z" fill="url(#gFront)" stroke="#0e141b" stroke-width="6"/>
    <!-- top panel (lid) -->
    <path d="M450 165 Q500 140 575 138 L765 170 Q712 196 640 195 Z" fill="url(#gTop)" stroke="#0e141b" stroke-width="6"/>

    <!-- piping on edges -->
    <path d="M450 168 L640 198 L766 173" fill="none" stroke="#ff5a1f" stroke-width="3" opacity=".9"/>
    <path d="M640 198 L640 664" stroke="#3e4e63" stroke-width="2.5"/>

    <!-- main zipper around lid -->
    <path d="M458 190 L636 220 L760 196" fill="none" stroke="#0b1016" stroke-width="5"/>
    <path d="M458 190 L636 220 L760 196" fill="none" stroke="#56677d" stroke-width="1.6" stroke-dasharray="2 3"/>
    <g transform="translate(700 208) rotate(-11)">
      <rect x="-4" y="-2" width="8" height="10" rx="2" fill="#b9c0c8"/>
      <rect x="-3" y="7" width="6" height="18" rx="3" fill="#ff5a1f"/>
    </g>

    <!-- carry handle -->
    <path d="M568 150 C 572 100, 662 104, 668 164" fill="none" stroke="#0d1218" stroke-width="16" stroke-linecap="round"/>
    <path d="M568 150 C 572 100, 662 104, 668 164" fill="none" stroke="#3a495c" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- rubber base -->
    <path d="M455 585 L640 634 L640 666 L462 618 Q455 616 455 608 Z" fill="#0b0f14"/>
    <path d="M640 634 L767 603 L766 626 Q764 634 756 636 L640 666 Z" fill="#080b0f"/>

    <!-- front putter pocket -->
    <path d="M470 398 Q470 384 484 386 L612 406 Q626 409 626 422 L628 618 L472 576 Z" fill="url(#gPocket)" stroke="#0b1016" stroke-width="4"/>
    <path d="M476 404 Q548 384 620 426" fill="none" stroke="#0b1016" stroke-width="5"/>
    <path d="M476 404 Q548 384 620 426" fill="none" stroke="#56677d" stroke-width="1.6" stroke-dasharray="2 3"/>
    <g transform="translate(600 414) rotate(18)">
      <rect x="-4" y="-2" width="8" height="10" rx="2" fill="#b9c0c8"/>
      <rect x="-3" y="7" width="6" height="18" rx="3" fill="#ff5a1f"/>
    </g>
    <!-- logo on pocket -->
    <g transform="translate(549 505) skewY(14)">
      <circle r="26" fill="none" stroke="#ff5a1f" stroke-width="3"/>
      <circle r="9" fill="none" stroke="#ff5a1f" stroke-width="3"/>
      <text y="52" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="13" letter-spacing="2.5" fill="#c9d2dc">EVANSPRINTS</text>
    </g>
    <!-- reflective stripe on front -->
    <path d="M462 300 L634 326" stroke="#5c6d82" stroke-width="3" opacity=".7"/>

    <!-- side mesh bottle pocket -->
    <path d="M648 438 L758 416 L757 598 L648 627 Z" fill="url(#mesh)" stroke="#0b1016" stroke-width="3"/>
    <path d="M648 438 L758 416" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round"/>
    <!-- side label patch -->
    <path d="M662 270 L742 255 L742 300 L662 316 Z" fill="#1a232e" stroke="#2b3848" stroke-width="2"/>

    <!-- webbing loop + carabiner for tags (front, upper right) -->
    <path d="M600 236 L626 240 L626 262 L600 258 Z" fill="#0d1218" stroke="#2b3848" stroke-width="1.5"/>
    <ellipse cx="613" cy="268" rx="9" ry="16" fill="none" stroke="#c2c8cf" stroke-width="4"/>
  </g>

  <!-- ===== BAG TAGS ===== -->
  <g class="target tags">
    <!-- chains -->
    <path d="M610 282 Q606 300 600 318" fill="none" stroke="#a9b0b8" stroke-width="2.5" stroke-dasharray="3 2"/>
    <path d="M616 282 Q630 304 642 330" fill="none" stroke="#a9b0b8" stroke-width="2.5" stroke-dasharray="3 2"/>
    <!-- gold tag (behind) -->
    <g transform="translate(646 366) rotate(12) scale(0.86 1)">
      <circle r="34" fill="url(#gGold)" stroke="#7d5a10" stroke-width="2"/>
      <circle r="27" fill="none" stroke="#9c7318" stroke-width="1.5"/>
      <circle cy="-27" r="4" fill="#1a232e"/>
      <text y="12" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="30" fill="#6b4c0c">7</text>
      <text y="24" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="7" letter-spacing="1" fill="#6b4c0c">LEAGUE</text>
    </g>
    <!-- silver tag (front) -->
    <g transform="translate(598 354) rotate(-8) scale(0.88 1)">
      <circle r="38" fill="url(#gSilver)" stroke="#5f6770" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#7d858e" stroke-width="1.5"/>
      <circle cy="-30" r="4.5" fill="#1a232e"/>
      <path d="M-20 -8 A22 22 0 0 1 20 -8" fill="none" stroke="#5f6770" stroke-width="1.2"/>
      <text y="14" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="34" fill="#323941">1</text>
      <text y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="8" letter-spacing="1.5" fill="#323941">2026</text>
    </g>
  </g>

  <!-- ===== MINI MARKER ===== -->
  <g class="target mini" transform="translate(60 0)">
    <!-- rim / thickness -->
    <path d="M238 698 A58 19 0 0 0 354 698 L354 704 A58 19 0 0 1 238 704 Z" fill="#c63d0b"/>
    <ellipse cx="296" cy="698" rx="58" ry="19" fill="url(#gMini)"/>
    <ellipse cx="296" cy="698" rx="46" ry="14" fill="none" stroke="#ffb98f" stroke-width="1.5" opacity=".8"/>
    <!-- stamp -->
    <g transform="translate(296 698) scale(1 0.33)">
      <circle r="22" fill="none" stroke="#fff" stroke-width="5"/>
      <circle r="7" fill="none" stroke="#fff" stroke-width="5"/>
    </g>
    <ellipse cx="276" cy="690" rx="18" ry="4" fill="#fff" opacity=".35"/>
  </g>

  <!-- ===== CALLOUTS ===== -->
  <g class="callout">
    <ellipse class="callout-ring" cx="622" cy="330" rx="80" ry="94"/>
    <path class="leader-halo" d="M697 300 L760 250 L842 250"/>
    <path class="leader" d="M697 300 L760 250 L842 250"/>
    <circle class="dot" cx="697" cy="300" r="5"/>
    <a class="cta" href="shop-bag-tags.html" aria-label="Shop Bag Tags">
      <rect class="pill" x="842" y="222" width="252" height="56" rx="28"/>
      <text x="866" y="259">Shop Bag Tags</text>
      <path class="arrow" d="M1066 250 h12 m-6 -6 l6 6 l-6 6"/>
    </a>
  </g>

  <g class="callout">
    <ellipse class="callout-ring" cx="356" cy="702" rx="86" ry="42"/>
    <path class="leader-halo" d="M300 670 L240 600 L240 586"/>
    <path class="leader" d="M300 670 L240 600 L240 586"/>
    <circle class="dot" cx="300" cy="670" r="5"/>
    <a class="cta" href="shop-minis.html" aria-label="Shop Minis">
      <rect class="pill" x="130" y="530" width="220" height="56" rx="28"/>
      <text x="156" y="567">Shop Minis</text>
      <path class="arrow" d="M314 558 h12 m-6 -6 l6 6 l-6 6"/>
    </a>
  </g>
</svg>
</main>
</body>
</html>
